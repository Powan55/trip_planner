name: CI

# Feature branches get the fast half on every push. The full browser suite runs
# on pull requests only: it takes about ten minutes, and the pull request is
# where the gate actually matters.
#
# workflow_call exists so deploy.yml can block its build job on these checks.
# Without it, a push to main deployed after a version check and a build and
# nothing else, and a direct push (which no pull request ever saw) was checked
# by nothing at all.
#
# Inside a workflow_call, github.event_name is the CALLER's ("push"), so the
# e2e job below is skipped on the deploy path. That is deliberate, but the
# reason is narrower than it first looks, and the difference matters.
#
# When the deploy came from a merged pull request, skipping is pure economy: the
# browser suite already ran against that merge result, so re-running it would
# add thirteen minutes to re-confirm the same tree.
#
# When main is pushed to directly, no pull request ever ran and the browser
# suite does not run at all. That path is covered by the checks below and
# nothing more. It is the path this whole arrangement exists for, and it is only
# partly closed here: the rest is branch protection, which prevents the push
# rather than inspecting it. Do not add conditional e2e here to compensate.
on:
  pull_request:
    branches: [dev, main]
  push:
    # Every branch but main, so a feature branch gets the fast half before it
    # opens a pull request. main is excluded because deploy.yml calls this
    # workflow on the push to main; listing it would run the same checks twice.
    branches-ignore: [main]
  workflow_call:

# Must not share a group with deploy.yml (which uses "pages"), or a CI run
# would queue behind a deploy. Now that deploy.yml calls this workflow, a
# shared group would also mean a deploy waiting on itself.
#
# Inside deploy.yml's workflow_call github.ref is the CALLER's, so every deploy
# lands in ci-refs/heads/main and the second one would cancel the checks job of a
# release still in flight. Deploy runs are already serialised by deploy.yml's own
# "pages" group, so not cancelling here queues nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks (markers · types · lint · unit · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before the scan, because a green scan from a broken pattern set is worse
      # than a red one: --self-test asserts PATTERNS and MUST_CATCH still line up
      # one-to-one and that every rule still matches its own case, so a deleted,
      # renamed or quietly-stopped-matching rule fails HERE rather than reporting
      # "clean". Nothing exercised that table until now.
      - name: Repository hygiene (marker set self-test)
        run: node scripts/marker-check.mjs --self-test

      # First, and before npm install on purpose. This needs no dependencies,
      # so a bad string fails in twenty seconds instead of after a three-minute
      # install.
      - name: Repository hygiene
        run: node scripts/marker-check.mjs

      # Also dependency-free, so it sits here for the same reason. The palette is a
      # pinned mirror of the tokens in globals.css/tailwind.config.ts, and a mirror
      # nothing runs enforces nothing — this is what makes the ink rule and the
      # AA floors fail a PR rather than a review.
      - name: Design token contrast
        run: node scripts/contrast-tokens.mjs

      # Third dependency-free check, same slot for the same reason. D-293 rule 2's 6s loop
      # floor called itself "grep-checkable" and nothing ever gripped it; this parses
      # globals.css and fails any sub-6s infinite animation that is not on D-322's
      # state-indicator allowlist, plus any loop missing its reduced-motion hard stop.
      - name: Ambient-loop floor
        run: node scripts/motion-loops.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trip/package-lock.json

      # --legacy-peer-deps is required, not optional: @types/node is pinned at
      # 20.6.2 and vite@8 (via vitest) wants ^20.19.0 || >=22.12.0.
      - name: Install
        run: npm ci --legacy-peer-deps

      # next.config.js has typescript.ignoreBuildErrors: false, so this also
      # runs during the build. Running it first gives a clearer failure.
      - name: Typecheck
        run: npx tsc --noEmit

      # next.config.js sets eslint.ignoreDuringBuilds, so the build below never
      # runs eslint. This step is the only thing that does.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # A non-resolving origin (the reserved .test TLD) so the concierge
          # chat component mounts and is covered, without calling anything real.
          NEXT_PUBLIC_CONCIERGE_URL: https://concierge.test
        run: npm run build

  # firestore.rules is published by the release now (deploy.yml's `publish-rules`, issue #39 /
  # D-399), so it can no longer ship unproven: this job runs scripts/rules-check.mjs against the
  # REAL Cloud Firestore rules engine in the local emulator, eleven phases including two negative
  # controls. It was left out of CI when it was written because it needs an emulator in the
  # runner; that cost is now smaller than shipping a ruleset nobody ran.
  #
  # NO `if:` on purpose. A condition on `github.event_name` would evaluate to the CALLER's event
  # inside workflow_call and skip this job on exactly the path that publishes — that inheritance
  # is the same fact that keeps `e2e` off the deploy path, recorded in D-302 (see its note on the
  # browser suite staying on the pull request; clause 5 is the separate rule not to loosen e2e's
  # own `if:`). D-305's successor rule applies: a conditional job here must fail toward running.
  #
  # No secrets, and none may ever be added: `--project demo-rules` is a fake project id the
  # emulator accepts precisely because it can never resolve to anything real, so this job cannot
  # reach nepalxjapan even by accident. Publishing needs a credential and therefore lives in
  # deploy.yml, which is the only file that can read one (D-302 clause 2).
  rules-check:
    name: Firestore rules (real rules engine, local emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trip/package-lock.json

      # The harness adds no dependency of its own: it resolves the firebase SDK by
      # createRequire against trip/package.json, because there is deliberately no root
      # package.json. So the app's install IS its dependency, and this step is not optional.
      # Do not "fix" the odd path by adding a package.json at the root.
      - name: Install (the harness reads trip/node_modules/firebase)
        working-directory: trip
        run: npm ci --legacy-peer-deps

      # THE SENTINEL FILE IS LOAD-BEARING. `firebase emulators:exec` returns exit code 2 even
      # when the inner script exits 0 — measured twice locally, including with a trivial
      # `node -e ''`: the log prints "Script exited successfully (code 0)" and then errors while
      # tearing the emulator down on SIGINT. Wiring the documented command in bare therefore
      # gives a RED gate on GREEN rules, which is how a gate ends up deleted. So the harness
      # records its own verdict in a file it can only create by exiting 0 (`&&` runs nothing
      # after a failure), the CLI's exit code is discarded, and the `test -f` below is what this
      # job actually asserts. Do not simplify this back to the bare command.
      #
      # The `|| true` is part of the same fix, not sloppiness: steps run under `bash -e`, so the
      # exit 2 we are deliberately ignoring would abort the step before the sentinel is tested.
      #
      # firebase-tools is pinned to a major so a v15 with different exec semantics cannot land
      # here unannounced. The Firestore emulator jar needs Java; the ubuntu runner image ships
      # one, and if that ever changes the fix is actions/setup-java, not dropping this job.
      - name: Validate firestore.rules against the emulator
        run: |
          npx --yes firebase-tools@14 emulators:exec --only firestore,auth --project demo-rules \
            "node scripts/rules-check.mjs && touch \"$RUNNER_TEMP/rules-ok\"" || true
          test -f "$RUNNER_TEMP/rules-ok"

  # Only on a pull request INTO main. `base_ref` is populated on pull_request and is
  # empty on every push, including the push that reaches this file through
  # deploy.yml's workflow_call — so this job is structurally absent from the deploy
  # path, and deploy.yml keeps its own copy rather than relying on this one.
  #
  # That asymmetry is the point. Conditioning on `github.ref == 'refs/heads/main'`
  # would let one job serve both paths and let deploy.yml drop its own, but if the
  # inherited context is not what we assume it fails SILENT — no gate on the deploy.
  # base_ref fails the other way, into a redundant twenty-second job. When the hinge
  # rests on a fact the repo cannot confirm, pick the one that fails toward running.
  #
  # A pull request into dev must NOT land here: dev collects many changes per release
  # and almost none of them bump the version.
  release-gate:
    name: Ready for main (version · release notes · came via dev)
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Its own checkout, and the two options below are the whole job. The `checks`
      # job above uses a bare checkout, and copying that here would ship a gate that
      # passes unconditionally: it decides by looking for a tag, and checkout fetches
      # no tags by default.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Assert this version is clear to ship
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/release-gate.mjs

  # Name kept exactly as-is (both dev's and main's branch protection require this
  # literal context string). It reads "visual advisory" only because that half moved
  # out: the visual specs now run for real in the `visual` job below, on a runner
  # whose OS matches the committed baselines. Renaming this job would make the
  # required check never report again until branch protection is updated to match
  # (owner-only, out of scope here) — see D-379.
  e2e:
    name: E2E (behavioural · visual advisory)
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trip/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      # playwright.config.ts serves the static export from out/ and does not
      # build it. Without this step every spec fails at server startup.
      - name: Build the static export
        env:
          NEXT_PUBLIC_CONCIERGE_URL: https://concierge.test
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # PLAYWRIGHT_SHOOT stays unset, which keeps landing-shots.spec.ts out of
      # the run. That spec is an asset generator: it rewrites committed PNGs.
      #
      # visual specs are excluded here on purpose, not merely skipped: this runner
      # is Linux and the committed baselines are Windows-only (`-win32`), so a visual
      # spec here can never do anything but report a missing snapshot. See the
      # `visual` job below, which runs the same specs on windows-latest instead.
      - name: Behavioural suite
        env:
          CI: '1'
        run: npm run test:e2e -- --grep-invert visual

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            trip/playwright-report
            trip/test-results
          retention-days: 14

  # D-379 (amends D-362). The 36 committed baselines are Windows-canonical, so this
  # job runs on windows-latest instead of matching the rest of CI — that is the whole
  # fix: same OS as the baselines means the platform-suffixed snapshot path Playwright
  # looks for actually exists, so this is a real compare, not a guaranteed miss.
  # No continue-on-error: unlike the old Linux step, this one can genuinely pass or
  # fail, so it should do exactly that.
  #
  # Same `if`/`needs` shape as `e2e` above, and for the same reason (D-302 clause 5):
  # inside workflow_call (the deploy path) github.event_name is the caller's "push",
  # so this stays off the deploy path too — that path is already covered by `e2e`'s
  # own note on why the browser suite deliberately stays on the pull request.
  visual:
    name: Visual regression (Windows baselines)
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: trip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trip/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build the static export
        env:
          NEXT_PUBLIC_CONCIERGE_URL: https://concierge.test
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Both visual sources match --grep visual: e2e/visual.spec.ts (its own describe
      # is titled "visual"), and the "TM visual · per-state hero baselines" describe
      # inside e2e/tm-acceptance.spec.ts, which testMatch in playwright.config.ts
      # scopes to the iphone-15-pro/iphone-15-pro-max projects. No --project filter
      # here, so all three projects run and the grep narrows each to its visual specs.
      - name: Visual regression
        env:
          CI: '1'
        run: npm run test:e2e -- --grep visual

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-windows-visual-${{ github.run_id }}
          path: |
            trip/playwright-report
            trip/test-results
          retention-days: 14
