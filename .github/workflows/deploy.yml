name: Deploy to GitHub Pages

# NO workflow_dispatch. It used to be here, and it was a live rollback button:
# dispatch registers from the DEFAULT branch but RUNS the chosen ref's own copy of
# this file, and six branches still sit at an untagged 5.12.0 carrying the
# pre-#46 job graph. Dispatching one of them passed the version gate (5.12.0 had
# never shipped, and the gate asserts inequality, not that the version went up),
# published a tree predating the whole access-control release with no typecheck,
# lint, unit or browser run, and then tagged v5.12.0 as if it were a release.
# To re-run a deploy that failed, use "Re-run all jobs" on the run itself: it
# replays this workflow at the same ref, which is the only case dispatch served.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Every deploy must carry a version number that has never been live before.
  # The marker for "was live" is a git tag v<version>, pushed only AFTER a
  # successful deploy (see the deploy job) — so re-running a failed deploy of
  # the same version is still allowed, but forgetting to bump before shipping
  # new bytes fails fast here.
  version-gate:
    name: Version must not already be deployed
    runs-on: ubuntu-latest
    steps:
      # fetch-depth/fetch-tags are load-bearing, not habit: the gate decides by
      # looking for a tag, and checkout's defaults fetch none, so a shallow
      # checkout makes it pass on a version that is already live.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # Same script the pull request into main already ran, so the two answers
      # cannot drift. HEAD_REF is unset here, which is what tells the script this
      # is the deploy path and there is no source branch to check.
      - name: Assert this version is clear to ship
        run: node scripts/release-gate.mjs

  # The checks that gate a pull request now also gate the deploy, by calling the
  # same workflow rather than copying its steps: repository hygiene, tsc, eslint,
  # unit tests, build. Roughly five minutes, and `build` below waits on it, so a
  # red check ships nothing.
  #
  # On the normal path (a pull request from dev) this re-runs against a tree the
  # pull request already checked. It is here for the path nothing covered: main
  # can be pushed to directly by a repo admin, and until now such a push reached
  # the live site after a version check and a build and nothing else.
  #
  # The browser suite deliberately stays on the pull request. See the note on
  # ci.yml's `on:` block for why it does not run here.
  #
  # `./` resolves against this same commit, so ci.yml and this reference always
  # ship together and cannot drift apart.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version-gate, checks]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trip/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Build static export (basePath + site URL derived from the repo)
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Public Firebase web config for optional cross-friend sync. NEXT_PUBLIC_* values
          # inline at build time, so the workflow must reference them here; absent the secrets
          # the expressions resolve empty and the site builds localStorage-only (no failure).
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          # NEXT_PUBLIC_TRIP_ID is retired (#10): the default pack is a local-only sample with
          # no remote path, so no build-time trip id exists to inject (it was never a secret —
          # NEXT_PUBLIC_* values ship in the public bundle).
          # AI concierge Worker URL (repo Actions variable). Absent => the chat feature
          # stays fully dormant in the build. Presence is echoed below (never the value).
          NEXT_PUBLIC_CONCIERGE_URL: ${{ vars.NEXT_PUBLIC_CONCIERGE_URL }}
        run: |
          echo "concierge-url present: ${NEXT_PUBLIC_CONCIERGE_URL:+yes}${NEXT_PUBLIC_CONCIERGE_URL:-NO}"
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trip/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # contents: write is needed only to push the success-marker tag below; the
    # job-level block overrides the read-only default, so pages/id-token
    # (required by deploy-pages) are restated here.
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Only reached if deploy-pages succeeded (a failed step halts the job),
      # so the tag records a genuinely-live version, never a failed attempt.
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: Tag this version as successfully deployed
        run: |
          VERSION=$(node -p "require('./trip/package.json').version")
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — nothing to record."
          else
            git tag -a "$TAG" -m "Successful GitHub Pages deploy of $TAG"
            git push origin "refs/tags/$TAG"
          fi
