name: Deploy to GitHub Pages

# NO workflow_dispatch. It used to be here, and it was a live rollback button:
# dispatch registers from the DEFAULT branch but RUNS the chosen ref's own copy of
# this file, and six branches still sit at an untagged 5.12.0 carrying the
# pre-#46 job graph. Dispatching one of them passed the version gate (5.12.0 had
# never shipped, and the gate asserts inequality, not that the version went up),
# published a tree predating the whole access-control release with no typecheck,
# lint, unit or browser run, and then tagged v5.12.0 as if it were a release.
# To re-run a deploy that failed, use "Re-run all jobs" on the run itself: it
# replays this workflow at the same ref, which is the only case dispatch served.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Every deploy must carry a version number that has never been live before.
  # The marker for "was live" is a git tag v<version>, pushed only AFTER a
  # successful deploy (see the deploy job) — so re-running a failed deploy of
  # the same version is still allowed, but forgetting to bump before shipping
  # new bytes fails fast here.
  version-gate:
    name: Version must not already be deployed
    runs-on: ubuntu-latest
    steps:
      # fetch-depth/fetch-tags are load-bearing, not habit: the gate decides by
      # looking for a tag, and checkout's defaults fetch none, so a shallow
      # checkout makes it pass on a version that is already live.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # Same script the pull request into main already ran, so the two answers
      # cannot drift. HEAD_REF is unset here, which is what tells the script this
      # is the deploy path and there is no source branch to check.
      - name: Assert this version is clear to ship
        run: node scripts/release-gate.mjs

  # The checks that gate a pull request now also gate the deploy, by calling the
  # same workflow rather than copying its steps: repository hygiene, tsc, eslint,
  # unit tests, build. Roughly five minutes, and `build` below waits on it, so a
  # red check ships nothing.
  #
  # On the normal path (a pull request from dev) this re-runs against a tree the
  # pull request already checked. It is here for the path nothing covered: main
  # can be pushed to directly by a repo admin, and until now such a push reached
  # the live site after a version check and a build and nothing else.
  #
  # The browser suite deliberately stays on the pull request. See the note on
  # ci.yml's `on:` block for why it does not run here.
  #
  # `./` resolves against this same commit, so ci.yml and this reference always
  # ship together and cannot drift apart.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  # `checks` covers ci.yml's new `rules-check` job too, and it has to: `needs` can only name
  # jobs declared in THIS file, so `needs: [version-gate, checks, rules-check]` would not be a
  # stricter gate, it would be a parse error on an unknown job. A called workflow succeeds or
  # fails as a unit, so a red rules-check makes `checks` red and nothing below it runs.
  build:
    needs: [version-gate, checks]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trip/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Build static export (basePath + site URL derived from the repo)
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Public Firebase web config for optional cross-friend sync. NEXT_PUBLIC_* values
          # inline at build time, so the workflow must reference them here; absent the secrets
          # the expressions resolve empty and the site builds localStorage-only (no failure).
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          # NEXT_PUBLIC_TRIP_ID is retired (#10): the default pack is a local-only sample with
          # no remote path, so no build-time trip id exists to inject (it was never a secret —
          # NEXT_PUBLIC_* values ship in the public bundle).
          # AI concierge Worker URL (repo Actions variable). REQUIRED since the Worker went
          # live (v1.8.0, 2026-08-09): the two guards below halt the build if it is empty or
          # carries a path. Presence is echoed below, never the value.
          NEXT_PUBLIC_CONCIERGE_URL: ${{ vars.NEXT_PUBLIC_CONCIERGE_URL }}
        run: |
          # Empty => isConciergeConfigured() is false, ConciergeChat renders null everywhere
          # and the whole AI feature ships silently absent, discovered only when a user goes
          # looking for it. Fail loudly here instead of printing "NO" and carrying on.
          # Whitespace is stripped for the test because a spaces-only value is worse than
          # empty: Boolean('   ') is true, so the app would consider itself configured and
          # send every request to a garbage URL.
          if [ -z "${NEXT_PUBLIC_CONCIERGE_URL//[[:space:]]/}" ]; then
            echo "::error::NEXT_PUBLIC_CONCIERGE_URL is not set, so the concierge would ship dormant and silently absent. Set the repository Actions variable (Settings -> Secrets and variables -> Actions -> Variables) to the Worker origin, then re-run."
            exit 1
          fi
          # Must be the BARE ORIGIN. lib/place-resolve.ts builds "<value>/resolve", so a
          # "/chat" suffix requests ".../chat/resolve" and is dead on arrival while chat
          # keeps working, which is exactly how it would hide (D-252). One trailing slash
          # is fine: place-resolve strips it and chat still POSTs to pathname "/".
          case "${NEXT_PUBLIC_CONCIERGE_URL%/}" in
            *://*/*)
              echo "::error::NEXT_PUBLIC_CONCIERGE_URL must be the bare Worker origin with no path. A path suffix breaks place-resolve (it would request <path>/resolve) while chat keeps working, so the breakage hides."
              exit 1
              ;;
          esac
          echo "concierge-url present: yes"
          npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: trip/out

  # Publishing firestore.rules is part of the release now instead of something someone
  # remembers (issue #39, D-399). The contract that buys: the live ruleset is the
  # firestore.rules from the tree of the most recent successful deploy tag, so "what is live"
  # is answerable offline with `git show v<version>:firestore.rules`.
  #
  # The publish is UNCONDITIONAL — no paths: filter, no "did the file change" test. A file-change
  # test answers "did the repo change", which gets read as "is the live ruleset current", and the
  # two diverge silently after a console edit, a failed earlier publish, or a release cut from a
  # branch that never carried the change. Unconditional means the console is now READ-ONLY for
  # rules: a console edit is reverted here without warning, so a console hotfix has to end in a
  # commit.
  #
  # BETWEEN build and deploy, not after it, and that ordering is the whole safety story. A failed
  # publish then ships NOTHING, leaving the live client and the live ruleset the matched pair
  # they already were — the same fail-closed idiom as `build: needs: [version-gate, checks]`.
  # After the deploy, a failure here would leave a new client running against old rules.
  #
  # THE CREDENTIAL LIVES IN THIS FILE AND CAN NEVER MOVE INTO ci.yml. Per D-302 clause 2 a
  # called workflow receives no secrets (the `checks:` call above passes no `secrets: inherit`),
  # so a `secrets.*` read in ci.yml resolves to the EMPTY STRING WITH NO ERROR on the deploy
  # path: one file, two call paths, silently different configuration, and the silent one is the
  # path that matters. ci.yml proves the rules against an emulator; only this file publishes.
  publish-rules:
    name: Publish firestore.rules
    needs: build
    runs-on: ubuntu-latest
    # Narrower than the workflow default on purpose: this is the one job holding a Google
    # credential, and it has no business with the Pages token or OIDC.
    permissions:
      contents: read
    # The `secrets` context is NOT readable from a job-level `if:`, but it IS readable in `env:`,
    # and `env` IS readable from a step-level `if:`. That indirection is what lets this land
    # INERT: with no secret set the job runs, warns, and changes nothing about the live project.
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned, and not decoration: this is the one job that runs with a Google credential, and
      # `npx firebase-tools@14` needs Node >= 20. Today's ubuntu-latest ships it, so leaving this
      # off would work right up until the runner image moves and the publish breaks with the key
      # already in hand. No npm cache: nothing here installs from a lockfile.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # VISIBLE, NOT BLOCKING (issue #183). continue-on-error + a real `exit 1` is the standard
      # GitHub Actions idiom for this: GitHub renders a continue-on-error step that failed with a
      # distinct warning icon in the run summary and checks list, so this no longer reads as a
      # plain green pass — but the STEP failing does not fail the JOB, so `deploy: needs:
      # publish-rules` (D-399) still runs unchanged. Same idiom already used below, in `deploy`'s
      # "Publish GitHub Release" step.
      #
      # Arming the real publish is still an OWNER decision, unchanged by this fix: the v5.14.0
      # client has been writing member rosters into Firestore under the OLD permissive rules
      # since 2026-08-10, and publishing the members-gated ruleset before those live rosters are
      # inspected can permanently lock out a traveller whose device has not opened the app since
      # — after the publish, only an existing member can add anyone.
      - name: No credential — rules NOT published
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        continue-on-error: true
        run: |
          echo "::error::FIREBASE_SERVICE_ACCOUNT is not set, so firestore.rules was NOT published. The live ruleset is whatever was last deployed by hand."
          {
            echo "### Firestore rules were not published"
            echo ""
            echo "\`FIREBASE_SERVICE_ACCOUNT\` is unset, so this release did not touch the live ruleset."
            echo "The live rules are whatever was last deployed by hand, which may be older than the \`firestore.rules\` in this tree."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Publish firestore.rules
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          # RUNNER_TEMP, never the workspace: the workspace is what gets built and uploaded as
          # the Pages artifact, and a service-account key that lands in it is published to the
          # public web. printf, not echo, so nothing is appended to or interpreted in the JSON.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # No --project flag: the target comes from the committed .firebaserc, so the project id
          # lives in exactly one reviewable place. That file is also the ONLY thing aiming this
          # at the right project — rules-check proves the rules against an emulator, never
          # against a live project, so it cannot catch a publish pointed somewhere else.
          npx --yes firebase-tools@14 deploy --only firestore:rules --non-interactive

  deploy:
    # publish-rules, not build: a failed publish must ship nothing (see the note above).
    # version-gate, checks and build are still upstream, transitively.
    needs: publish-rules
    runs-on: ubuntu-latest
    # contents: write is needed only to push the success-marker tag below; the
    # job-level block overrides the read-only default, so pages/id-token
    # (required by deploy-pages) are restated here.
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      # Only reached if deploy-pages succeeded (a failed step halts the job),
      # so the tag records a genuinely-live version, never a failed attempt.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - name: Tag this version as successfully deployed
        run: |
          VERSION=$(node -p "require('./trip/package.json').version")
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — nothing to record."
          else
            git tag -a "$TAG" -m "Successful GitHub Pages deploy of $TAG"
            git push origin "refs/tags/$TAG"
          fi
      # The gate already proved trip/docs/RELEASES.md carries this version's entry with no
      # hold marker, so the same file is fit to ship as the release's own notes — no separate
      # changelog to keep in sync. Recomputes TAG rather than reading it from the step above:
      # steps do not share shell state, and re-deriving from package.json is one line either way.
      # continue-on-error: a failure here (heading missing, transient API hiccup) must not
      # redden a deploy that already shipped — Pages is live and the tag is pushed by this
      # point, and this repo has no rollback, so a red run here inviting a panicked revert
      # would be a worse outcome than a release that's simply late.
      - name: Publish GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./trip/package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to record."
          else
            node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
