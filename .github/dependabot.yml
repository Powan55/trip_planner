version: 2

# Two things here are easy to get wrong and silent when you do.
#
# `directory:` — one entry per package.json, and there are two: `/trip` (the app) and
# `/tools` (the CI-only firebase-tools pin). The default `/` would watch neither and
# report nothing, which looks identical to "no updates available".
#
# `target-branch: dev` — every change lands on dev first, and main deploys on
# merge. Note the trade this makes: with target-branch set, this config no
# longer applies to Dependabot *security* updates, which always target the
# default branch. Security updates are off at the repo level today, so nothing
# is currently routed at main; if they are ever switched on, they will open
# against main and want a version bump and a release note before they can go in.

updates:
  - package-ecosystem: npm
    directory: /trip
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # One PR a month for the routine drift. Majors stay ungrouped so each one
      # gets read on its own.
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # tools/package-lock.json pins the firestore.rules publish toolchain by integrity hash
  # (#478). That closed a supply-chain hole and froze the patch path in the same move: the
  # `npx --yes` re-resolution it replaced was what used to carry transitive fixes in, and the
  # lock landed reporting 8 advisories, one of them critical. This entry is now the ONLY thing
  # that bumps that tree, which is why it exists rather than being folded into /trip above.
  #
  # No `groups` block, unlike /trip: there is one direct dependency here, so everything is
  # ungrouped anyway — which is what that block's "majors get read on their own" intent asks
  # for. A firebase-tools major needs the same care ci.yml's comment describes; v15 changes
  # `emulators:exec` semantics, and the two pins still have to move together.
  - package-ecosystem: npm
    directory: /tools
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  # Every `uses:` is pinned to a commit SHA. Dependabot rewrites the SHA and the
  # trailing `# vX.Y.Z` comment, so the pin keeps its meaning and stops being a
  # slow freeze onto old action releases. Worth knowing: SHA-pinned actions never
  # produce Dependabot alerts, so this scheduled bump is the only thing watching
  # them at all.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      # Majors ungrouped here too, matching the npm block above: a major action bump
      # can change behaviour and should be read on its own rather than buried in a batch.
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
